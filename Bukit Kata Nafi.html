<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bukit Kata Nafi</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: score bar and road canvas on top, one large panel below (notes and name, then questions, then the time board),
   with a collapsible note card at the bottom for use during play.
   One sunny look on purpose (a game screen), so every colour is set explicitly. */
:root {
  --ink: #1b2a3a;
  --ink-soft: #46586b;
  --page: #d8edf2;
  --card: #ffffff;
  --sun: #f5b301;
  --car: #d94a2b;
  --grass: #4f9d45;
  --soil: #b4532a;
  --good: #1f7a44;
  --good-bg: #cdf0d8;
  --soft: #b8400d;
  --soft-bg: #ffe0cf;
  --hl: #fff1c2;
  --line: #c9d6df;
  --focus: #1f6aa5;
  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font: 600 1rem/1.5 var(--body);
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font: 800 clamp(2rem, 7vw, 2.8rem)/1 var(--display); text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-weight: 800; }
button, input { font-family: var(--body); color: var(--ink); }
button { cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.mini {
  min-height: 44px; padding: 0 16px; font-weight: 800; font-size: .95rem;
  background: var(--card); border: 2px solid var(--ink); border-radius: 12px;
}

.stage { border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--card); box-shadow: 0 5px 0 var(--ink); }
.hud { display: grid; grid-template-columns: 1fr 1fr 1.3fr .9fr; gap: 8px; padding: 10px 12px; background: var(--sun); border-bottom: 3px solid var(--ink); }
.stat { min-width: 0; }
.k { display: block; font-weight: 800; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; }
.v { display: flex; align-items: center; gap: 4px; font: 800 1.35rem/1.15 var(--display); font-variant-numeric: tabular-nums; }
.v svg { width: 1.1rem; height: 1.1rem; fill: var(--ink); }
.bar { height: 16px; margin-top: 5px; border: 2px solid var(--ink); border-radius: 8px; background: var(--card); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--good); transition: width .4s; }
.bar.low i { background: var(--soft); }
#cv { display: block; width: 100%; height: clamp(210px, 54vw, 320px); }

.panel { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 18px 16px 20px; box-shadow: 0 5px 0 var(--ink); }
.panel h2 { margin: 0 0 8px; font: 800 1.7rem/1.1 var(--display); text-wrap: balance; }
.nh { margin: 18px 0 8px; font: 800 1.3rem/1.2 var(--display); }
.qno { margin: 0 0 6px; font-weight: 800; color: var(--ink-soft); letter-spacing: .02em; }
.sentence { margin: 0 0 18px; font: 600 clamp(1.55rem, 5.8vw, 2.2rem)/1.4 var(--display); }
.blank { display: inline-block; min-width: 4.2em; margin: 0 .15em; border-bottom: 5px solid var(--ink); text-align: center; vertical-align: bottom; line-height: 1.15; font-weight: 800; }
.blank.filled { color: var(--good); border-color: var(--good); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt {
  min-height: 80px; padding: 6px 4px; font: 800 clamp(1.4rem, 6vw, 2rem)/1.1 var(--display);
  background: var(--card); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink);
  overflow-wrap: anywhere;
}
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.opt:disabled { cursor: default; }
.opt.wrong { background: var(--soft-bg); border-color: var(--soft); box-shadow: 0 5px 0 var(--soft); color: var(--soft); }
.opt.good { background: var(--good-bg); border-color: var(--good); box-shadow: 0 5px 0 var(--good); color: var(--good); }
.opt:disabled:not(.good):not(.wrong) { opacity: .5; }
.fb { margin: 16px 0 0; min-height: 3em; font-weight: 800; font-size: 1.15rem; line-height: 1.4; }
.fb.ok { color: var(--good); }
.fb.no { color: var(--soft); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.go {
  width: 100%; max-width: 380px; min-height: 68px; margin-top: 8px; font: 800 1.7rem var(--display);
  background: var(--sun); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink);
}
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.lab { display: block; margin-bottom: 6px; font-weight: 800; }
.nm {
  width: 100%; max-width: 380px; min-height: 60px; padding: 0 14px; font: 800 1.4rem var(--display);
  background: var(--card); border: 3px solid var(--ink); border-radius: 14px;
}
.err { margin: 6px 0 0; min-height: 1.5em; color: var(--soft); font-weight: 800; }
.plain { margin: 0 0 6px; font-size: 1.1rem; }
.score { margin: 4px 0; font: 600 1.3rem var(--display); }
.score b { font-size: 2.2rem; font-weight: 800; }
.starrow { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
.starrow svg { width: 28px; height: 28px; fill: #d4dce3; stroke: var(--ink); stroke-width: 1.5; }
.starrow svg.on { fill: var(--sun); }
.msg { margin: 0 0 6px; font-size: 1.15rem; }

.lbwrap { overflow-x: auto; margin: 4px 0 14px; }
.lbt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.lbt caption { text-align: left; padding-bottom: 6px; font: 800 1.3rem var(--display); }
.lbt th { text-align: left; padding: 6px 8px; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; border-bottom: 3px solid var(--ink); }
.lbt td { padding: 8px; border-bottom: 2px solid var(--line); font-weight: 800; }
.lbt td.nm2 { overflow-wrap: anywhere; min-width: 7em; }
.lbt tr.me td { background: var(--hl); }
.lbt .tm { white-space: nowrap; }
.rk { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); font: 800 1rem var(--display); background: var(--card); }
.rk.r1 { background: var(--sun); }
.rk.r2 { background: #d5dde4; }
.rk.r3 { background: #e5a572; }
.gap td { text-align: center; color: var(--ink-soft); border-bottom: 0; padding: 2px; }

.cards { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 6px 16px; }
.cards summary { min-height: 52px; display: flex; align-items: center; font: 800 1.25rem var(--display); cursor: pointer; }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; padding: 6px 0 10px; }
.kad { border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.kad .w { justify-self: start; padding: 0 12px; border-radius: 10px; color: #fff; font: 800 1.45rem/1.5 var(--display); }
.kad p { margin: 0; }
.kad .r { font-weight: 800; }
.kad .e { color: var(--ink); }
.kad .e b { color: var(--car); }
.kad .lbl { color: var(--ink-soft); font-size: .85rem; }
.petua { margin: 4px 0 14px; padding: 10px 14px; border: 2px dashed var(--ink); border-radius: 14px; background: var(--hl); }
.petua p { margin: 0 0 4px; font: 800 1.15rem var(--display); }
.petua ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 2px; font-weight: 800; }

@media (prefers-reduced-motion: reduce) {
  .bar i { transition: none; }
}
</style>

<main class="wrap">
  <header class="top">
    <div>
      <h1>Bukit Kata Nafi</h1>
      <p class="sub">Bahasa Melayu · Tahun 6 PPKI</p>
    </div>
    <button type="button" class="mini" id="snd" aria-pressed="true">Bunyi: hidup</button>
  </header>

  <section class="stage" aria-label="Permainan mendaki bukit">
    <div class="hud">
      <div class="stat"><span class="k">Soalan</span><span class="v" id="hQ">0/10</span></div>
      <div class="stat"><span class="k">Masa</span><span class="v" id="hT">0:00</span></div>
      <div class="stat"><span class="k">Minyak</span><div class="bar" id="hFb"><i id="hF"></i></div></div>
      <div class="stat"><span class="k">Bintang</span><span class="v"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/></svg><span id="hS">0</span></span></div>
    </div>
    <canvas id="cv" aria-hidden="true"></canvas>
  </section>

  <section class="panel" id="panel" aria-live="off"></section>

  <details class="cards" id="cards" hidden>
    <summary>Nota: tidak, bukan dan tiada</summary>
    <div id="notebody"></div>
  </details>
</main>

<script>
(function () {
  'use strict';
  var N = 10, SEG = 300, M = 6, FLAGX = N * SEG + 90, ENDX = N * SEG + 30;
  var SCORE_KEY = 'bukitKataNafiScores';
  var REDUCE = false;
  try { REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var WORDS = {
    bukan: { hint: 'Selepas ini ada nama orang, benda atau tempat.' },
    tiada: { hint: 'Sesuatu itu tidak ada.' }
  };

  var QS = [
    ['Itu ', ' kucing, itu anjing.', 'bukan'],
    ['Ini ', ' buku saya, ini buku Ali.', 'bukan'],
    ['Dia ', ' murid Tahun 5, dia murid Tahun 6.', 'bukan'],
    ['Itu ', ' rumah cikgu, itu sekolah.', 'bukan'],
    ['Pak Ali ', ' seorang guru, dia seorang petani.', 'bukan'],
    ['Ini ', ' pensel, ini pen.', 'bukan'],
    ['Itu ', ' bola, itu belon.', 'bukan'],
    ['Kakak ', ' doktor, kakak seorang jururawat.', 'bukan'],
    ['Di dalam beg saya ', ' buku.', 'tiada'],
    ['Hari ini ', ' kerja sekolah.', 'tiada'],
    ['Di atas meja ', ' pensel.', 'tiada'],
    ['Dalam peti sejuk ', ' susu.', 'tiada'],
    ['', ' orang di dalam kelas.', 'tiada'],
    ['Di halaman rumah ', ' kereta.', 'tiada'],
    ['Di dalam bakul ', ' buah.', 'tiada'],
    ['', ' air di dalam botol.', 'tiada']
  ];

  function el(id) { return document.getElementById(id); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function rnd(k) { var s = Math.sin(k * 127.1) * 43758.5453; return s - Math.floor(s); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtS(ms) {
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function fmtP(ms) {
    var t = Math.round(ms / 100), m = Math.floor(t / 600), sec = (t % 600) / 10;
    return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
  }

  function pickQuestions() {
    var out = [];
    Object.keys(WORDS).forEach(function (w) {
      var g = QS.filter(function (q) { return q[2] === w; });
      out = out.concat(shuffle(g).slice(0, N / 2));
    });
    return shuffle(out).map(function (q) { return { b: q[0], a: q[1], ans: q[2], opts: shuffle(['bukan', 'tiada']) }; });
  }

  /* ---------- sound and speech ---------- */
  var ac = null, soundOn = true;
  function tone(f, t0, d, type, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, ac.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t0 + d);
    o.connect(g); g.connect(ac.destination);
    o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + d + 0.02);
  }
  function beep(kind) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (kind === 'good') { tone(523, 0, .14, 'triangle', .25); tone(659, .12, .14, 'triangle', .25); tone(784, .24, .22, 'triangle', .25); }
      else if (kind === 'bad') { tone(200, 0, .25, 'triangle', .3); tone(160, .15, .3, 'triangle', .3); }
      else { tone(523, 0, .15, 'triangle', .25); tone(659, .15, .15, 'triangle', .25); tone(784, .3, .15, 'triangle', .25); tone(1047, .45, .4, 'triangle', .25); }
    } catch (e) {}
  }
  function speak(txt) {
    try {
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ms-MY'; u.rate = 0.85;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  var canSpeak = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);

  /* ---------- scores: this device, plus the shared class board when the page can use it ---------- */
  var localScores = [], shared = [], sharedReady = false, dbc = null;
  function validScore(e) { return e && e.id && typeof e.t === 'number' && isFinite(e.t) && e.t > 0; }
  try {
    var raw = JSON.parse(localStorage.getItem(SCORE_KEY) || '[]');
    if (Array.isArray(raw)) localScores = raw.filter(validScore);
  } catch (e) {}
  function saveLocal() { try { localStorage.setItem(SCORE_KEY, JSON.stringify(localScores.slice(-200))); } catch (e) {} }
  function allScores() {
    var m = {};
    localScores.concat(shared).forEach(function (e) { if (validScore(e)) m[e.id] = e; });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return a.t - b.t || a.d - b.d; });
  }
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('db').then(function (db) {
        if (!db) return;
        dbc = db;
        db.collection('scores').orderBy('t', 'asc').limit(100).onSnapshot(function (snap) {
          shared = snap.docs.map(function (d) {
            var x = d.data() || {};
            return { id: d.id, n: String(x.n || ''), t: Number(x.t), s: Number(x.s) || 0, d: Number(x.d) || 0 };
          }).filter(validScore);
          sharedReady = true;
          if (S.phase === 'end') renderBoard();
        }, function () { sharedReady = false; });
      }).catch(function () {});
    }
  } catch (e) {}

  /* ---------- game state ---------- */
  var S = { phase: 'intro', qs: [], i: 0, tries: 0, stars: 0, lock: false, driving: false, run: 0, name: '', elapsed: 0, timing: false, qStart: 0, entry: null };
  var car = { x: 0, tx: 0, rot: 0, moving: false, shake: 0 };
  var fuel = 100, tm = 0, parts = [], conf = [];

  /* ---------- canvas ---------- */
  var cv = el('cv'), ctx = cv.getContext('2d');
  var W = 300, H = 220, DPR = 1, SC = 1, VW = 300, VH = 220, camX = 0, camY = 0, camY0 = 0;

  function ty(x) { return 260 - x * 0.10 + Math.sin(x * 0.018) * 16 + Math.sin(x * 0.047 + 1.3) * 8; }

  function resetCam() {
    camY0 = ty(0) - VH * 0.62;
    camY = ty(car.x) - VH * 0.62;
  }
  function size() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(200, r.width); H = Math.max(160, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    SC = Math.max(0.8, Math.min(1.4, W / 430));
    VW = W / SC; VH = H / SC;
    resetCam();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function hillLayer(p, color, base, amp, wl) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var sx = 0; sx <= W + 6; sx += 6) {
      var wx = camX * p * SC + sx;
      var y = base + (camY0 - camY) * p * SC + amp * Math.sin(wx / wl) + amp * 0.5 * Math.sin(wx / (wl * 0.43) + 2);
      ctx.lineTo(sx, y);
    }
    ctx.lineTo(W + 6, H);
    ctx.closePath();
    ctx.fill();
  }

  function cloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.beginPath();
    ctx.arc(x, y, 14 * s, 0, 7); ctx.arc(x + 16 * s, y - 8 * s, 18 * s, 0, 7); ctx.arc(x + 36 * s, y, 14 * s, 0, 7);
    ctx.fill();
    ctx.fillRect(x, y, 36 * s, 14 * s);
  }

  function topPath(x0, x1) {
    ctx.beginPath();
    ctx.moveTo(x0, ty(x0));
    for (var x = x0 + 5; x <= x1; x += 5) ctx.lineTo(x, ty(x));
  }

  function palm(wx) {
    var by = ty(wx), h = 62 + rnd(wx) * 30, lean = (rnd(wx + 3) - 0.5) * 20;
    var tx = wx + lean, tyy = by - h;
    ctx.strokeStyle = '#7a4a24'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(wx, by + 2); ctx.quadraticCurveTo(wx + lean * 0.1, by - h * 0.55, tx, tyy); ctx.stroke();
    ctx.strokeStyle = '#2f7d3a'; ctx.lineWidth = 5;
    for (var i = 0; i < 5; i++) {
      var a = -Math.PI * 0.97 + i * (Math.PI * 0.94 / 4);
      var ex = tx + Math.cos(a) * 36, ey = tyy + Math.sin(a) * 16 + 16;
      ctx.beginPath(); ctx.moveTo(tx, tyy);
      ctx.quadraticCurveTo(tx + Math.cos(a) * 20, tyy + Math.sin(a) * 30 - 6, ex, ey); ctx.stroke();
    }
    ctx.fillStyle = '#6b3f1d';
    ctx.beginPath(); ctx.arc(tx - 3, tyy + 6, 4, 0, 7); ctx.arc(tx + 4, tyy + 8, 4, 0, 7); ctx.fill();
  }

  function sign(x, label) {
    var by = ty(x);
    ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, by + 2); ctx.lineTo(x, by - 34); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 2;
    rr(x - 22, by - 52, 44, 20, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1b2a3a'; ctx.font = "800 12px 'Baloo 2', 'Trebuchet MS', sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, by - 41);
  }

  function flag(x) {
    var by = ty(x);
    ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, by + 2); ctx.lineTo(x, by - 92); ctx.stroke();
    var s = 10, ox = x + 2, oy = by - 92;
    for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#ffffff' : '#1b2a3a';
      ctx.fillRect(ox + c * s, oy + r * s, s, s);
    }
    ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 2; ctx.strokeRect(ox, oy, s * 4, s * 3);
  }

  function wheel(x, y, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#2a2d36'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#cfd8dc'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6b7a86'; ctx.lineWidth = 2;
    for (var i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(i * Math.PI / 2) * 6, Math.sin(i * Math.PI / 2) * 6); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCar() {
    var xr = car.x - 28, xf = car.x + 28;
    var yr = ty(xr) - 14, yf = ty(xf) - 14;
    var ang = Math.atan2(yf - yr, 56);
    var bob = car.moving ? Math.sin(tm * 18) * 1.4 : Math.sin(tm * 7) * 0.7;
    var sh = car.shake > 0 && !REDUCE ? (Math.random() - 0.5) * 5 : 0;
    ctx.save();
    ctx.translate(car.x + sh, (yr + yf) / 2 - 3 + bob);
    ctx.rotate(ang);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 3;
    ctx.fillStyle = '#d94a2b';
    ctx.beginPath(); ctx.moveTo(-24, -26); ctx.lineTo(-14, -46); ctx.lineTo(18, -46); ctx.lineTo(30, -26); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#bfe9f7';
    ctx.beginPath(); ctx.moveTo(-18, -29); ctx.lineTo(-11, -42); ctx.lineTo(14, -42); ctx.lineTo(23, -29); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8b48a';
    ctx.beginPath(); ctx.arc(3, -35, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#1f6aa5';
    ctx.beginPath(); ctx.arc(3, -37, 7, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#d94a2b';
    rr(-46, -28, 92, 22, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f5b301'; ctx.fillRect(-42, -20, 84, 4);
    ctx.fillStyle = '#fff6b0'; ctx.beginPath(); ctx.arc(43, -17, 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#8a1f10'; ctx.fillRect(-46, -20, 3, 7);
    ctx.restore();
    wheel(xr, yr, car.rot);
    wheel(xf, yf, car.rot);
  }

  function drawWorld() {
    var x0 = camX - 12, x1 = camX + VW + 12, bottom = camY + VH + 60, k, x;
    topPath(x0, x1);
    ctx.lineTo(x1, bottom); ctx.lineTo(x0, bottom); ctx.closePath();
    ctx.fillStyle = '#b4532a'; ctx.fill();
    ctx.lineCap = 'butt';
    ctx.save(); ctx.translate(0, 30); topPath(x0, x1); ctx.strokeStyle = '#c4693c'; ctx.lineWidth = 9; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.translate(0, 66); topPath(x0, x1); ctx.strokeStyle = '#9a4423'; ctx.lineWidth = 9; ctx.stroke(); ctx.restore();
    topPath(x0, x1); ctx.strokeStyle = '#4f9d45'; ctx.lineWidth = 13; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.save(); ctx.translate(0, -3); topPath(x0, x1); ctx.strokeStyle = '#7ac36a'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
    for (k = Math.floor((camX - 60) / 190); k * 190 < camX + VW + 60; k++) {
      x = k * 190 + rnd(k) * 70;
      if (x < -40 || x > FLAGX + 200) continue;
      var near = Math.abs(x - Math.round(x / SEG) * SEG) < 28;
      if (!near) palm(x);
    }
    sign(-70, 'MULA');
    for (k = 1; k < N; k++) sign(k * SEG, (k * SEG / M) + ' m');
    flag(FLAGX);
    for (var j = 0; j < N; j++) {
      [0.35, 0.68].forEach(function (f) {
        var cx = j * SEG + f * SEG;
        if (cx < car.x + 6 || cx < camX - 20 || cx > camX + VW + 20) return;
        var cy = ty(cx) - 32 + Math.sin(tm * 4 + cx) * 3;
        ctx.fillStyle = '#f5b301'; ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, cy + 4); ctx.stroke();
      });
    }
    drawCar();
    parts.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.8;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8fd3ea'); g.addColorStop(1, '#e6f6ef');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,214,90,.35)'; ctx.beginPath(); ctx.arc(W * 0.82, H * 0.2, 40, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.arc(W * 0.82, H * 0.2, 26, 0, 7); ctx.fill();
    for (var c = 0; c < 4; c++) {
      var m = W + 240;
      var cx = (((c * 310 - camX * 0.1 * SC) % m) + m) % m - 120;
      cloud(cx, 30 + (c % 3) * 24, 0.9 + (c % 2) * 0.3);
    }
    hillLayer(0.12, '#9fd2b5', H * 0.62, 28, 130);
    hillLayer(0.26, '#7cbb8e', H * 0.76, 24, 85);
    ctx.setTransform(DPR * SC, 0, 0, DPR * SC, -camX * DPR * SC, -camY * DPR * SC);
    drawWorld();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    conf.forEach(function (p) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-4, -2, 8, 4); ctx.restore();
    });
  }

  /* ---------- hud ---------- */
  var cache = {};
  function setText(id, v) { if (cache[id] !== v) { cache[id] = v; el(id).textContent = v; } }
  function answeringMs() {
    return S.elapsed + (S.timing ? performance.now() - S.qStart : 0);
  }
  function hud() {
    setText('hQ', (S.phase === 'intro' ? 0 : Math.min(S.i + 1, N)) + '/' + N);
    setText('hT', fmtS(answeringMs()));
    setText('hS', String(S.stars));
    var f = Math.round(fuel);
    if (cache.f !== f) {
      cache.f = f;
      el('hF').style.width = f + '%';
      el('hFb').className = 'bar' + (f < 40 ? ' low' : '');
    }
  }

  /* ---------- update ---------- */
  function spawn(x, y, vx, vy, life, r, col) { parts.push({ x: x, y: y, vx: vx, vy: vy, life: life, max: life, r: r, col: col }); }
  function smoke() {
    if (REDUCE) return;
    for (var i = 0; i < 9; i++) spawn(car.x + 40, ty(car.x + 40) - 34, 10 + Math.random() * 30, -30 - Math.random() * 40, 0.8, 4 + Math.random() * 5, '#8d99a5');
  }

  function update(dt) {
    tm += dt;
    var dx = car.tx - car.x;
    if (Math.abs(dx) > 0.5) {
      var sp = Math.max(50, Math.min(150, Math.abs(dx) * 1.6));
      var step = Math.min(Math.abs(dx), sp * dt);
      car.x += step; car.rot += step / 14; car.moving = true;
      fuel = Math.max(15, fuel - step * 0.04);
      if (!REDUCE && Math.random() < 0.5) spawn(car.x - 40, ty(car.x - 40) - 4, -25 - Math.random() * 25, -10 - Math.random() * 20, 0.5, 2.5 + Math.random() * 3, '#e0c3a4');
    } else if (car.moving) {
      car.moving = false; car.x = car.tx;
      if (S.driving) { S.driving = false; onArrive(); }
    }
    if (car.shake > 0) car.shake -= dt;
    parts.forEach(function (p) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; });
    parts = parts.filter(function (p) { return p.life > 0; });
    conf.forEach(function (p) { p.y += p.vy * dt; p.x += p.vx * dt; p.r += dt * 4; });
    conf = conf.filter(function (p) { return p.y < H + 20; });
    var target = ty(car.x) - VH * 0.62;
    camY += (target - camY) * (1 - Math.pow(0.002, dt));
    camX = car.x - VW * 0.36;
    hud();
  }

  var last = 0;
  function frame(t) {
    var dt = Math.min(0.05, ((t - last) / 1000) || 0);
    last = t;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  /* ---------- notes ---------- */
  function noteHTML() {
    return '<div class="cardgrid">' +
      '<div class="kad"><span class="w" style="background:#1f6aa5">tidak</span>' +
      '<p class="r">Sebelum perbuatan dan sifat.</p>' +
      '<p class="e"><b>Adik tidak</b> makan nasi.</p><p class="lbl">makan = perbuatan</p>' +
      '<p class="e">Bunga itu <b>tidak</b> cantik.</p><p class="lbl">cantik = sifat</p></div>' +
      '<div class="kad"><span class="w" style="background:#7a3fb0">bukan</span>' +
      '<p class="r">Sebelum nama orang, benda atau tempat.</p>' +
      '<p class="e">Itu <b>bukan</b> kucing.</p><p class="lbl">kucing = nama benda</p>' +
      '<p class="e">Dia <b>bukan</b> murid Tahun 5.</p><p class="lbl">murid = nama orang</p></div>' +
      '<div class="kad"><span class="w" style="background:#1b7a6b">tiada</span>' +
      '<p class="r">Bermaksud tidak ada.</p>' +
      '<p class="e">Di atas meja <b>tiada</b> pensel.</p><p class="lbl">tiada pensel = tidak ada pensel</p>' +
      '<p class="e"><b>Tiada</b> orang di dalam kelas.</p><p class="lbl">tiada orang = tidak ada orang</p></div>' +
      '</div>' +
      '<div class="petua"><p>Petua cepat</p><ul>' +
      '<li>Selepas itu nama? Guna bukan.</li>' +
      '<li>Selepas itu perbuatan atau sifat? Guna tidak.</li>' +
      '<li>Boleh tukar dengan "tidak ada"? Guna tiada.</li></ul></div>';
  }

  /* ---------- panel ---------- */
  var panel = el('panel');
  var starSvg = '<svg viewBox="0 0 24 24" class="{c}" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/></svg>';

  function renderIntro() {
    panel.innerHTML =
      '<h2>Sedia untuk mendaki bukit?</h2>' +
      '<h3 class="nh">1. Baca nota dahulu</h3>' + noteHTML() +
      '<h3 class="nh">2. Tulis nama anda</h3>' +
      '<label class="lab" for="nm">Nama murid</label>' +
      '<input class="nm" id="nm" type="text" maxlength="24" autocomplete="off" placeholder="Tulis nama di sini">' +
      '<p class="err" id="nerr" role="alert"></p>' +
      '<h3 class="nh">3. Tekan Mula</h3>' +
      '<p class="plain">Pilih bukan atau tiada. Jawapan betul, kereta naik bukit. Jawab dengan betul dan cepat untuk naik ke papan masa!</p>' +
      '<button type="button" class="go" id="go">Mula</button>';
  }

  function renderQ() {
    var q = S.qs[S.i];
    S.tries = 0; S.lock = false;
    S.qStart = performance.now(); S.timing = true;
    var h = '<p class="qno">Soalan ' + (S.i + 1) + ' daripada ' + N + ' · ' + esc(S.name) + '</p>' +
      '<p class="sentence">' + q.b + '<span class="blank" id="blank"></span>' + q.a + '</p><div class="opts">';
    q.opts.forEach(function (w) { h += '<button type="button" class="opt" data-w="' + w + '">' + w + '</button>'; });
    h += '</div><p class="fb" id="fb" role="status" aria-live="polite">Pilih bukan atau tiada.</p>';
    if (canSpeak) h += '<div class="row"><button type="button" class="mini" id="say">Dengar ayat</button></div>';
    panel.innerHTML = h;
  }

  function renderBoard() {
    var box = el('board');
    if (!box) return;
    var list = allScores(), cur = S.entry, rank = -1;
    list.forEach(function (e, i) { if (cur && e.id === cur.id) rank = i; });
    function row(e, i) {
      var me = cur && e.id === cur.id;
      return '<tr' + (me ? ' class="me"' : '') + '><td><span class="rk' + (i < 3 ? ' r' + (i + 1) : '') + '">' + (i + 1) + '</span></td>' +
        '<td class="nm2">' + esc(e.n || '-') + (me ? ' (anda)' : '') + '</td>' +
        '<td class="tm">' + fmtP(e.t) + '</td><td>' + e.s + '/' + N + '</td></tr>';
    }
    var h = '<div class="lbwrap"><table class="lbt"><caption>' + (sharedReady ? 'Papan masa kelas' : 'Papan masa (peranti ini)') + '</caption>' +
      '<thead><tr><th>#</th><th>Nama</th><th>Masa</th><th>Bintang</th></tr></thead><tbody>';
    list.slice(0, 10).forEach(function (e, i) { h += row(e, i); });
    if (rank >= 10) h += '<tr class="gap"><td colspan="4">...</td></tr>' + row(list[rank], rank);
    h += '</tbody></table></div>';
    box.innerHTML = h;
  }

  function renderEnd() {
    var stars = '';
    for (var i = 0; i < N; i++) stars += starSvg.replace('{c}', i < S.stars ? 'on' : '');
    var msg = S.stars >= 9 ? 'Hebat sekali! Anda pandai menggunakan bukan dan tiada.'
      : S.stars >= 6 ? 'Bagus! Cuba lagi untuk dapat semua bintang.'
      : 'Tahniah kerana sampai! Baca nota, kemudian main lagi.';
    panel.innerHTML =
      '<h2>Anda sampai di puncak, ' + esc(S.name) + '!</h2>' +
      '<p class="score"><b>' + S.stars + '</b> daripada ' + N + ' bintang</p>' +
      '<p class="score">Masa anda: <b>' + fmtP(S.entry.t) + '</b></p>' +
      '<div class="starrow" role="img" aria-label="' + S.stars + ' bintang daripada ' + N + '">' + stars + '</div>' +
      '<p class="msg">' + msg + '</p>' +
      '<div id="board"></div>' +
      '<button type="button" class="go" id="again">Murid seterusnya</button>';
    renderBoard();
  }

  function fillBlank(q) {
    var b = el('blank');
    b.textContent = q.b === '' ? cap(q.ans) : q.ans;
    b.className = 'blank filled';
  }

  function choose(btn) {
    if (S.lock || S.phase !== 'play') return;
    var q = S.qs[S.i], w = btn.getAttribute('data-w'), fb = el('fb');
    if (w === q.ans) {
      S.lock = true;
      S.elapsed += performance.now() - S.qStart; S.timing = false;
      if (S.tries === 0) S.stars++;
      btn.classList.add('good');
      fillBlank(q);
      fb.className = 'fb ok';
      fb.textContent = S.tries === 0 ? 'Betul! Hebat!' : 'Betul! Tahniah!';
      fuel = Math.min(100, fuel + 25);
      beep('good');
      Array.prototype.forEach.call(panel.querySelectorAll('.opt'), function (b) { b.disabled = true; });
      car.tx = S.i === N - 1 ? ENDX : (S.i + 1) * SEG;
      S.driving = true;
    } else {
      S.tries++;
      btn.disabled = true;
      btn.classList.add('wrong');
      fb.className = 'fb no';
      fb.textContent = 'Cuba lagi. Petunjuk: ' + WORDS[q.ans].hint;
      fuel = Math.max(25, fuel - 8);
      car.shake = REDUCE ? 0 : 0.5;
      smoke();
      beep('bad');
    }
  }

  function onArrive() {
    var run = S.run;
    if (S.i === N - 1) {
      setTimeout(function () { if (S.run === run) finish(); }, 500);
    } else {
      setTimeout(function () { if (S.run === run) { S.i++; renderQ(); } }, 700);
    }
  }

  function finish() {
    S.phase = 'end';
    var id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    S.entry = { id: id, n: S.name, t: Math.max(1, Math.round(S.elapsed)), s: S.stars, d: Date.now() };
    localScores.push(S.entry);
    saveLocal();
    if (dbc) {
      try {
        dbc.collection('scores').doc(id).set({ n: S.entry.n, t: S.entry.t, s: S.entry.s, d: S.entry.d }).catch(function () {});
      } catch (e) {}
    }
    renderEnd();
    beep('win');
    if (!REDUCE) {
      var cols = ['#d94a2b', '#f5b301', '#1f6aa5', '#4f9d45', '#7a3fb0'];
      for (var i = 0; i < 70; i++) conf.push({ x: Math.random() * W, y: -Math.random() * 120, vx: (Math.random() - 0.5) * 40, vy: 70 + Math.random() * 90, r: Math.random() * 6, c: cols[i % cols.length] });
    }
  }

  function resetRun() {
    S.run++;
    S.i = 0; S.stars = 0; S.tries = 0; S.lock = false; S.driving = false;
    S.elapsed = 0; S.timing = false; S.entry = null;
    car.x = 0; car.tx = 0; car.rot = 0; car.moving = false; car.shake = 0;
    fuel = 100; parts = []; conf = [];
    resetCam();
  }

  function showIntro() {
    resetRun();
    S.phase = 'intro';
    el('cards').hidden = true;
    renderIntro();
    hud();
  }

  function startGame() {
    resetRun();
    S.qs = pickQuestions();
    S.phase = 'play';
    el('cards').hidden = false;
    el('cards').open = false;
    renderQ();
    hud();
  }

  function tryStart() {
    var inp = el('nm');
    var nm = (inp.value || '').replace(/\s+/g, ' ').trim().slice(0, 24);
    if (!nm) {
      el('nerr').textContent = 'Sila tulis nama anda dahulu.';
      inp.focus();
      return;
    }
    S.name = nm;
    startGame();
  }

  /* ---------- events ---------- */
  panel.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.getAttribute('data-w')) choose(b);
    else if (b.id === 'go') tryStart();
    else if (b.id === 'again') showIntro();
    else if (b.id === 'say') {
      var q = S.qs[S.i];
      speak(q.b + ' titik titik ' + q.a);
    }
  });
  panel.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'nm') { e.preventDefault(); tryStart(); }
  });
  panel.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'nm') { var er = el('nerr'); if (er) er.textContent = ''; }
  });
  document.addEventListener('keydown', function (e) {
    if (S.phase !== 'play' || e.ctrlKey || e.metaKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 2) {
      var opts = panel.querySelectorAll('.opt');
      if (opts[n - 1] && !opts[n - 1].disabled) choose(opts[n - 1]);
    }
  });
  el('snd').addEventListener('click', function () {
    soundOn = !soundOn;
    this.setAttribute('aria-pressed', String(soundOn));
    this.textContent = 'Bunyi: ' + (soundOn ? 'hidup' : 'mati');
  });
  window.addEventListener('resize', size);

  /* ---------- boot ---------- */
  el('notebody').innerHTML = noteHTML();
  size();
  showIntro();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
